name: Günlük Kurumsal Haber Taramasi

on:
  schedule:
    # Türkiye saati 07:00 için UTC 04:00 ayarlanır (Kış-Yaz saati sabit TR için)
    - cron: '0 4 * * *'
  workflow_dispatch: # Manuel çalıştırma imkanı sunar

jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests feedparser trafilatura beautifulsoup4 google-genai psycopg2-binary openpyxl

      - name: Tarama ve Raporlama Scriptini Çalıştır
        env:
          # GitHub Secrets'tan alınacak değerler
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GONDEREN_MAIL: ${{ secrets.GONDEREN_MAIL }}
          GONDEREN_SIFRE: ${{ secrets.GONDEREN_SIFRE }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py
